<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare Agent - Your AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="app-title">🏥 ElderCare Agent</h1>
            <p class="app-subtitle">Your friendly AI assistant</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Conversation Display -->
            <div class="conversation-container" id="conversation">
                <!-- Welcome Message -->
                <div class="message agent-message">
                    <div class="message-content">
                        <p class="message-text">
                            👋 Hello! I'm your ElderCare assistant.
                            I can help you with:
                        </p>
                        <ul class="help-list">
                            <li>📞 Calling family and friends</li>
                            <li>💊 Medication reminders</li>
                            <li>📅 Doctor appointments</li>
                        </ul>
                        <p class="message-text">
                            Just speak or type what you need!
                        </p>
                    </div>
                </div>
            </div>

            <!-- UI Display Area (for dynamic UIs like call buttons, medication reminders) -->
            <div class="ui-container" id="uiContainer">
                <!-- Dynamic UI elements will be inserted here -->
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <!-- Voice Input Button -->
                <button class="voice-button" id="voiceButton" aria-label="Press to speak">
                    <span class="voice-icon" id="voiceIcon">🎤</span>
                    <span class="voice-text" id="voiceText">Tap to Speak</span>
                </button>

                <!-- Text Input (fallback) -->
                <div class="text-input-container">
                    <input
                        type="text"
                        id="textInput"
                        class="text-input"
                        placeholder="Or type your message here..."
                        aria-label="Type your message">
                    <button class="send-button" id="sendButton" aria-label="Send message">
                        ➤
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <button class="footer-button" id="historyButton">📜 View History</button>
            <button class="footer-button" id="endSessionButton">🚪 End Session</button>
        </footer>
    </div>

    <!-- Loading Indicator -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">Thinking...</p>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/speech.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
