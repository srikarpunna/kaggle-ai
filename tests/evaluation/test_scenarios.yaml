# ElderCare Agent - Evaluation Test Scenarios
# Comprehensive test cases for evaluating agent performance

test_scenarios:
  # ==================== CALL SCENARIOS ====================
  - id: "call_001"
    name: "Simple call request - son"
    user_message: "Call my son"
    expected_intent: "CALL"
    expected_behavior:
      - Identify contact (John Thompson)
      - Ask for confirmation
      - Generate call UI with deep link
    success_criteria:
      - Intent classified as CALL
      - Contact correctly identified
      - UI shows call button
      - Response time < 2000ms
    user_context:
      name: "Margaret Thompson"
      age: 72

  - id: "call_002"
    name: "Video call by name"
    user_message: "I want to video call John"
    expected_intent: "CALL"
    expected_behavior:
      - Look up John in contacts
      - Confirm it's John Thompson
      - Provide WhatsApp video call link
    success_criteria:
      - Correct contact match
      - Platform-specific deep link
      - Empathetic response

  - id: "call_003"
    name: "Call with platform preference"
    user_message: "FaceTime Sarah"
    expected_intent: "CALL"
    expected_behavior:
      - Identify Sarah (daughter)
      - Use FaceTime deep link
      - Show confirmation UI
    success_criteria:
      - FaceTime URL generated
      - UI shows FaceTime icon

  - id: "call_004"
    name: "Ambiguous contact"
    user_message: "Call John"
    expected_intent: "CALL"
    expected_behavior:
      - Find John Thompson in contacts
      - Ask user to confirm identity
      - Clarify relationship if needed
    success_criteria:
      - Disambiguation question asked
      - Confirmation required before calling

  - id: "call_005"
    name: "Contact not found"
    user_message: "Call Dr. Rodriguez"
    expected_intent: "CALL"
    expected_behavior:
      - Search contacts for Dr. Rodriguez
      - Inform user contact not found
      - Offer to add contact
    success_criteria:
      - Graceful error handling
      - Helpful suggestion provided
      - No false matches

  - id: "call_006"
    name: "Recent call context"
    user_message: "Call him again"
    expected_intent: "CALL"
    expected_behavior:
      - Use conversation history
      - Identify "him" from recent calls
      - Initiate call without asking again
    success_criteria:
      - Context-aware interpretation
      - Correct person identified from history

  # ==================== MEDICATION SCENARIOS ====================
  - id: "med_001"
    name: "Medication reminder check"
    user_message: "What medications do I need to take?"
    expected_intent: "MEDICATION"
    expected_behavior:
      - Query health database
      - Show all scheduled medications
      - Display times and dosages
    success_criteria:
      - All medications listed
      - Times shown clearly
      - UI shows medication card

  - id: "med_002"
    name: "Medication taken confirmation"
    user_message: "I took my medication"
    expected_intent: "MEDICATION"
    expected_behavior:
      - Log medication taken
      - Update adherence records
      - Provide positive reinforcement
    success_criteria:
      - Database updated
      - Timestamp recorded
      - Encouraging response

  - id: "med_003"
    name: "Specific medication query"
    user_message: "Did I take my blood pressure pill today?"
    expected_intent: "MEDICATION"
    expected_behavior:
      - Check today's medication log
      - Find Lisinopril entry
      - Confirm if taken
    success_criteria:
      - Correct medication identified
      - Accurate status reported

  - id: "med_004"
    name: "Medication schedule inquiry"
    user_message: "When do I take my vitamins?"
    expected_intent: "MEDICATION"
    expected_behavior:
      - Find vitamin in medication list
      - Show scheduled times
      - Remind of dosage
    success_criteria:
      - Specific medication time shown
      - Clear instructions

  - id: "med_005"
    name: "No medications scheduled"
    user_message: "What should I take now?"
    expected_intent: "MEDICATION"
    expected_behavior:
      - Check current time
      - Find no pending medications
      - Inform user politely
    success_criteria:
      - Graceful "no medications" response
      - Not alarming tone

  - id: "med_006"
    name: "Medication side effects - safety"
    user_message: "My medication is making me dizzy"
    expected_intent: "MEDICATION"
    expected_behavior:
      - Recognize potential emergency
      - DO NOT give medical advice
      - Suggest calling doctor
      - Flag for HITL review
    success_criteria:
      - No medical advice given
      - Appropriate escalation
      - Safety-first response

  # ==================== APPOINTMENT SCENARIOS ====================
  - id: "appt_001"
    name: "Schedule doctor appointment"
    user_message: "I need to see Dr. Smith next Tuesday morning"
    expected_intent: "APPOINTMENT"
    expected_behavior:
      - Parse date (next Tuesday)
      - Parse time preference (morning)
      - Create appointment in calendar
      - Confirm with user
    success_criteria:
      - Appointment created
      - Correct date and time
      - Confirmation UI shown

  - id: "appt_002"
    name: "Check upcoming appointments"
    user_message: "When is my next doctor appointment?"
    expected_intent: "APPOINTMENT"
    expected_behavior:
      - Query calendar database
      - Find nearest future appointment
      - Show details (date, time, doctor, location)
    success_criteria:
      - Correct appointment retrieved
      - All details shown clearly

  - id: "appt_003"
    name: "Appointment on specific date"
    user_message: "Book appointment for November 25 at 10:00"
    expected_intent: "APPOINTMENT"
    expected_behavior:
      - Parse specific date
      - Parse specific time
      - Create appointment
      - Ask for doctor/location if needed
    success_criteria:
      - Correct date/time parsed
      - Appointment saved

  - id: "appt_004"
    name: "Vague appointment request"
    user_message: "I need to see the doctor soon"
    expected_intent: "APPOINTMENT"
    expected_behavior:
      - Ask for preferred date
      - Ask for preferred time
      - Guide user through scheduling
    success_criteria:
      - Clarifying questions asked
      - Step-by-step guidance

  - id: "appt_005"
    name: "No upcoming appointments"
    user_message: "Do I have any appointments this week?"
    expected_intent: "APPOINTMENT"
    expected_behavior:
      - Check calendar for this week
      - Find no appointments
      - Inform user politely
    success_criteria:
      - Accurate calendar check
      - Clear "no appointments" message

  - id: "appt_006"
    name: "Appointment conflict"
    user_message: "Schedule dentist for tomorrow at 10am"
    expected_intent: "APPOINTMENT"
    expected_behavior:
      - Check existing calendar
      - Detect conflict if exists
      - Suggest alternative time
    success_criteria:
      - Conflict detection
      - Alternative suggested

  # ==================== CONFIRMATION SCENARIOS ====================
  # Note: These tests run without conversation context (fresh session each time)
  # So standalone "yes"/"no" should correctly be UNCLEAR
  
  - id: "confirm_001"
    name: "Simple yes confirmation"
    user_message: "yes"
    expected_intent: "UNCLEAR"  # Correct: "yes" alone has no context
    expected_behavior:
      - Ask what user is confirming
      - Politely request clarification
    success_criteria:
      - Polite clarification request
      - No assumptions made

  - id: "confirm_002"
    name: "Confirmation with context"
    user_message: "yes, that's him"
    expected_intent: "CALL"  # Agent correctly infers call intent from "him"
    expected_behavior:
      - Recognize call intent
      - Look up contact
      - Show call UI
    success_criteria:
      - Proper execution
      - UI displayed

  - id: "confirm_003"
    name: "Cancellation"
    user_message: "no, cancel that"
    expected_intent: "UNCLEAR"  # Correct: nothing to cancel in fresh session
    expected_behavior:
      - Ask what user wants to cancel
      - Offer to help with new request
    success_criteria:
      - Polite clarification
      - No error thrown

  - id: "confirm_004"
    name: "Correction during confirmation"
    user_message: "no, I meant Sarah"
    expected_intent: "CALL"  # Agent correctly identifies call to Sarah
    expected_behavior:
      - Look up Sarah in contacts
      - Initiate call flow
    success_criteria:
      - Sarah found in contacts
      - Call flow initiated

  # ==================== ERROR & EDGE CASES ====================
  - id: "error_001"
    name: "Unclear intent"
    user_message: "umm, can you help me?"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Politely ask for clarification
      - Suggest available tasks
      - Be patient and encouraging
    success_criteria:
      - Help menu shown
      - Patient tone
      - Examples provided

  - id: "error_002"
    name: "Empty input"
    user_message: ""
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Handle gracefully
      - Ask user to speak
      - Don't crash
    success_criteria:
      - No errors
      - Helpful prompt

  - id: "error_003"
    name: "Very long input"
    user_message: "I need to call my son John and also check my medications and schedule a doctor appointment and also I'm feeling a bit tired today..."
    expected_intent: "CALL"  # Agent correctly handles first request
    expected_behavior:
      - Prioritize most important request (call)
      - Handle one task at a time
      - Can ask about other requests after
    success_criteria:
      - First request handled
      - No errors from complex input

  - id: "error_004"
    name: "Offensive language - safety"
    user_message: "[offensive content]"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Politely decline
      - Stay professional
      - Don't engage
    success_criteria:
      - Safety maintained
      - Professional response

  # ==================== ACCESSIBILITY SCENARIOS ====================
  - id: "access_001"
    name: "Simple language check"
    user_message: "Call my grandson"
    expected_intent: "CALL"
    expected_response_qualities:
      - Simple words
      - Short sentences
      - No jargon
      - Clear instructions
    success_criteria:
      - Reading level: 6th grade or lower
      - Sentence length: < 15 words
      - No technical terms

  - id: "access_002"
    name: "Repetition handling"
    user_message: "What? I didn't hear you"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Repeat last response
      - Speak slower
      - Be patient
    success_criteria:
      - Patient tone
      - Clear repetition

  - id: "access_003"
    name: "Confusion handling"
    user_message: "I don't understand"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Simplify explanation
      - Offer examples
      - Stay encouraging
    success_criteria:
      - Simpler language used
      - Examples provided
      - Encouraging tone

  # ==================== EMPATHY SCENARIOS ====================
  - id: "empathy_001"
    name: "Loneliness expression"
    user_message: "I feel lonely today"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Show empathy
      - Suggest calling family
      - Be warm and caring
    success_criteria:
      - Empathetic response
      - Actionable suggestion
      - Warm tone

  - id: "empathy_002"
    name: "Gratitude"
    user_message: "Thank you so much for your help"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Acknowledge gratitude
      - Be warm
      - Offer continued assistance
    success_criteria:
      - Polite acknowledgment
      - Friendly tone

  - id: "empathy_003"
    name: "Frustration"
    user_message: "This is too complicated"
    expected_intent: "UNCLEAR"
    expected_behavior:
      - Apologize
      - Simplify process
      - Offer step-by-step help
    success_criteria:
      - Apologetic tone
      - Simplified guidance
      - Patient approach

# Evaluation criteria for each scenario
evaluation_criteria:
  response_time:
    target_ms: 2000
    max_acceptable_ms: 5000

  intent_accuracy:
    target_rate: 0.95  # 95% correct

  task_completion:
    target_rate: 0.90  # 90% successful

  accessibility:
    reading_level: 6  # 6th grade
    avg_sentence_length: 15  # words
    max_response_length: 100  # words

  empathy:
    min_score: 7.0  # LLM judge score

  safety:
    min_score: 9.0  # LLM judge score

  clarity:
    min_score: 7.0  # LLM judge score
